<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="90%">
      <stop offset="0%" stop-color="#13203c"/><stop offset="60%" stop-color="#070b16"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="920" height="380" rx="16" fill="url(#bg)"/>

  <text x="40" y="48" fill="#eaf0fb" font-size="22" font-weight="800">⚡ AIOps — Autonomous Incident Resolution</text>
  <text x="40" y="72" fill="#7e8db0" font-size="14">Watch one incident flow through the agent · interactive demo</text>

  <!-- wires -->
  <path d="M150,200 H250" stroke="#37e08a" stroke-width="2.5" fill="none"/>
  <path d="M370,200 H470" stroke="#37e08a" stroke-width="2.5" fill="none"/>
  <path d="M590,200 H690" stroke="#37e08a" stroke-width="2.5" fill="none"/>
  <path d="M810,235 V300 H85 V250" stroke="#5aa2ff" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>

  <!-- store -->
  <rect x="40" y="155" width="90" height="90" rx="14" fill="#0f1626" stroke="#37e08a" stroke-width="1.5"/>
  <text x="85" y="208" text-anchor="middle" font-size="34">🛒</text>
  <text x="85" y="268" text-anchor="middle" fill="#37e08a" font-size="11" font-weight="700">✓ resolved</text>

  <!-- nodes -->
  <g>
    <rect x="250" y="165" width="120" height="70" rx="12" fill="#0f1626" stroke="#37e08a" stroke-width="1.5"/>
    <text x="310" y="198" text-anchor="middle" font-size="22">🔎</text>
    <text x="310" y="220" text-anchor="middle" fill="#7e8db0" font-size="10">Detect</text>
  </g>
  <g>
    <rect x="470" y="165" width="120" height="70" rx="12" fill="#0f1626" stroke="#37e08a" stroke-width="1.5"/>
    <text x="530" y="198" text-anchor="middle" font-size="22">🧠</text>
    <text x="530" y="220" text-anchor="middle" fill="#7e8db0" font-size="10">Diagnose · RAG</text>
  </g>
  <g>
    <rect x="690" y="165" width="120" height="70" rx="12" fill="#0f1626" stroke="#5aa2ff" stroke-width="1.5" filter="url(#glow)"/>
    <text x="750" y="198" text-anchor="middle" font-size="22">🛡️</text>
    <text x="750" y="220" text-anchor="middle" fill="#7e8db0" font-size="10">Guardrail</text>
  </g>

  <!-- play overlay -->
  <g transform="translate(460,330)">
    <circle cx="0" cy="0" r="22" fill="#5aa2ff"/>
    <path d="M-7,-11 L11,0 L-7,11 Z" fill="#021"/>
  </g>
  <text x="460" y="372" text-anchor="middle" fill="#eaf0fb" font-size="14" font-weight="700">▶ Click to open the live demo</text>
</svg>
